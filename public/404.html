<style>
:root{--o:#DC6A40;--od:#C25A34;--k:#121212;--p:#F3EDE6;--mu:#6b655e;--ln:#e8e1d8;--ez:cubic-bezier(.2,.8,.2,1);
  --pj:"Plus Jakarta Sans",system-ui,sans-serif;--gs:"Geist",system-ui,sans-serif;--gm:"Geist Mono",ui-monospace,monospace;--se:"Instrument Serif",Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#FBF8F4;color:var(--k);font-family:var(--gs);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--o);outline-offset:3px}

/* header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid rgba(18,18,18,.07);transition:transform .45s var(--ez);animation:hdr-in .9s var(--ez) both}
@keyframes hdr-in{from{transform:translateY(-100%)}to{transform:none}}
.hdr.hide{transform:translateY(-100%)}
.hdr-in{max-width:1400px;margin:0 auto;padding:12px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand img{height:46px;width:46px;object-fit:contain;transition:transform .5s var(--ez)}
.brand:hover img{transform:rotate(-8deg) scale(1.06)}
.nav{display:flex;align-items:center;gap:28px;font-size:calc(15px * 0.86);font-weight:500}
.nav>a,.grp>button{position:relative;padding:8px 0;background:none;border:0;font:inherit;color:inherit;cursor:pointer;display:flex;align-items:center;gap:6px}
.nav>a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1.5px;background:var(--o);transform:scaleX(0);transform-origin:0 50%;transition:transform .4s var(--ez)}
.nav>a:hover::after,.nav>a.on::after{transform:scaleX(1)}
.nav>a.on{color:var(--od)}
.grp{position:relative}
.grp svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6;transition:transform .3s}
.grp:hover svg,.grp:focus-within svg{transform:rotate(180deg)}
.grp-panel{position:absolute;top:calc(100% + 10px);left:50%;width:320px;padding:10px;background:#fff;border-radius:16px;box-shadow:0 0 0 1px #ece6df,0 30px 60px -30px rgba(18,18,18,.3);opacity:0;visibility:hidden;transform:translate(-50%,8px);transition:opacity .25s,transform .3s var(--ez),visibility .25s}
.grp-panel::before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px}
.grp:hover .grp-panel,.grp:focus-within .grp-panel{opacity:1;visibility:visible;transform:translate(-50%,0)}
.grp-k{display:block;padding:6px 10px 8px;font:500 calc(11px * 0.86) var(--gm);letter-spacing:.08em;text-transform:uppercase;color:var(--od)}
.grp-panel a{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;transition:background .25s}
.grp-panel a:hover{background:#F7F3EE}
.grp-panel a img{width:38px;height:38px;object-fit:contain;border-radius:10px;box-shadow:inset 0 0 0 1px #ece6df;padding:3px;background:#fff}
.grp-panel b{display:block;font-size:calc(14px * 0.86);font-weight:600}
.grp-panel small{font-size:calc(12px * 0.86);color:var(--mu)}
.grp-panel i{margin-left:auto;font-style:normal;color:var(--o);transition:transform .3s var(--ez)}
.grp-panel a:hover i{transform:translateX(4px)}
.book{padding:12px 22px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--k);font-size:calc(14px * 0.86);font-weight:500;transition:background .3s,color .3s}
.book:hover{background:var(--k);color:#fff}
.burger{display:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--k);background:#fff;cursor:pointer;font-size:calc(18px * 0.86);color:var(--k)}
.mnav{display:none}
@media(max-width:899px){
  .nav,.book{display:none}
  .burger{display:grid;place-items:center}
  .hdr-in{padding:10px 20px}
  .mnav.open{display:flex;flex-direction:column;padding:6px 20px 22px;border-top:1px solid #ece6df;background:#fff}
  .mnav a{padding:14px 0;border-bottom:1px solid #ece6df;font-size:calc(17px * 0.86);font-weight:600;display:flex;justify-content:space-between}
  .mnav .k{padding:18px 0 4px;font:500 calc(11px * 0.86) var(--gm);letter-spacing:.08em;text-transform:uppercase;color:var(--od)}
  .mnav .cta{margin-top:14px;border:0;justify-content:center;background:var(--k);color:#fff;border-radius:999px}
}

/* the two buttons (same in every variation) */
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{position:relative;display:inline-flex;align-items:center;gap:12px;min-height:54px;padding:0 28px;border-radius:999px;font-size:calc(15px * 0.86);font-weight:500;overflow:hidden;isolation:isolate;transition:transform .35s var(--ez),box-shadow .35s,color .35s,background .35s;will-change:transform}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;transform:scaleX(0);transform-origin:0 50%;transition:transform .55s var(--ez)}
.btn.dark{background:var(--k);color:#fff;box-shadow:0 14px 30px -16px rgba(18,18,18,.55)}
.btn.dark::before{background:var(--o)}

.cs .sv-silk path{stroke:#B9A898;stroke-opacity:.14}
.cs .sv-silk path:nth-child(4n){stroke-opacity:.24}
/* ===== hero: cream-white instead of grey ===== */
.f{background:#F7F4EF}
.f-bg{background:radial-gradient(80% 70% at 50% 45%,#FFFFFF 0%,#F8F5F0 55%,#EFEAE3 100%)!important}
.f-bg .b1{background:radial-gradient(circle,#FFFFFF 0%,rgba(255,255,255,0) 66%)!important;opacity:.9!important}
.f-bg .b2{background:radial-gradient(circle,#F3E4D8 0%,rgba(243,228,216,0) 66%)!important;opacity:.7!important}
.f-bg .b3{background:radial-gradient(circle,#FBEFE6 0%,rgba(251,239,230,0) 66%)!important;opacity:.8!important}
.f-silk path{stroke:#B9A898!important;stroke-opacity:.16!important}
.f-silk path:nth-child(4n){stroke-opacity:.28!important}
.f-dots{background-image:radial-gradient(rgba(185,168,152,.55) 1.1px,transparent 1.3px)!important}
.f-vig{background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 60%,rgba(120,90,60,.08) 100%)!important}
.f-spot{background:radial-gradient(520px circle at var(--mx) var(--my),rgba(255,255,255,.7),rgba(255,255,255,0) 60%)!important}
.f-grain{opacity:.12!important}
.cs .sv-silk g{animation-duration:6.5s}
.cs-wrap{width:100%}
@media(min-width:900px) and (min-height:600px){.sv.cs{height:100vh!important;height:100svh!important}}
.cs .sv-h2{font-size:calc(clamp(34px,min(3.6vw,6vh),58px) * 0.86)}
.car{margin-top:clamp(18px,3.6vh,44px)}
.cr-view{-webkit-mask:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%);mask:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%)}

/* ===== equal cards: same size, same inner spacing ===== */
.car{--cw:clamp(340px,26vw,390px)}
.sc-card,.sc-card.act{opacity:1;transform:none!important;filter:none;height:clamp(470px,58vh,520px);margin-top:16px;padding:9px 9px 18px;display:flex;flex-direction:column}
.sc-card{background:linear-gradient(165deg,#FFFFFF,#FBF7F2);border:1px solid #EFE8DF;box-shadow:0 34px 60px -40px rgba(120,60,30,.35)}
.sc-card[data-d="-3"],.sc-card[data-d="3"]{opacity:1}
.sc-card:not(.act){opacity:.78}
.sc-in{flex:none;height:clamp(136px,16.5vh,152px);padding:20px 22px;display:flex;flex-direction:column}
.sc-k{font-size:calc(11px * 0.86)}
.sc-t{margin-top:6px;font-size:calc(clamp(20px,min(1.6vw,2.9vh),24px) * 0.86);line-height:1.15}
.sc-d{margin-top:8px;-webkit-line-clamp:2;font-size:calc(13.5px * 0.86);line-height:1.5;min-height:3em}
.sc-chk{flex:1;padding:18px 14px 0;gap:clamp(5px,1vh,9px);overflow:hidden}
.sc-chk li{font-size:calc(13.5px * 0.86)}
.sc-card .sc-cta{flex:none;margin:14px 9px 0;height:46px}
.sc-tag{font-size:calc(11.5px * 0.86)}
.sc-card.act{background:linear-gradient(165deg,#F38A57 0%,#DC6A40 55%,#B9482A 100%);border-color:#E57A4C;box-shadow:0 44px 80px -40px rgba(185,72,42,.7)}

/* ===== controls centred ===== */
.cr-ctl{justify-content:center;gap:28px;padding:0;margin-top:clamp(22px,4vh,40px)}
.cr-ctl{flex-direction:row}
.cr-arr{order:0}.cr-dots{order:1}
.cr-ctl .cr-arr{display:contents}
.cr-ctl .cr-prev{order:0}.cr-ctl .cr-dots{order:1}.cr-ctl .cr-next{order:2}
.cr-arr button{background:#fff;border-color:#E6DFD6}
.cr-dot i{background:rgba(20,20,20,.18)}
/* hover arrow takes no space until shown */
.sc-chk .ca{width:0;overflow:visible;margin-left:4px}
.sc-chk a{padding-right:22px}
/* shorter laptop screens */
@media(min-width:900px) and (max-height:820px){
 .sv.cs{padding-top:calc(96px + 6px);padding-bottom:10px}
 .cs .sv-h2{font-size:calc(clamp(30px,5vh,44px) * 0.86)}
 .car{margin-top:12px}
 .sc-card,.sc-card.act{height:clamp(420px,64vh,500px);padding-bottom:14px}
 .sc-in{height:auto;padding:14px 18px}
 .sc-chk{padding-top:12px;gap:3px}
 .sc-chk li,.sc-d{font-size:calc(12.5px * 0.86)}

 .cr-ctl{margin-top:14px}
 .cr-arr button{width:40px;height:40px}
}
@media(max-width:899px){.car{--cw:82vw}.sc-card,.sc-card.act{height:auto;min-height:480px}.sc-in{height:auto}}
.sc-card,.sc-card.act,.sc-card:hover{box-shadow:none!important}.sc-tag{box-shadow:none}

/* ================= SECTION 3: Why GAA ================= */
.sv.wy{background:radial-gradient(70% 60% at 50% 40%,#FFFFFF,#F7F4EF 60%,#EFEAE3);justify-content:center}
@media(min-width:900px) and (min-height:600px){.sv.wy{height:100vh;height:100svh}}
.wy .sv-silk path{stroke:#B9A898;stroke-opacity:.14}
.wy .sv-silk path:nth-child(4n){stroke-opacity:.24}
.wy-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.wy-eye{display:inline-flex;align-items:center;gap:12px;font-size:calc(12px * 0.86);font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--o)}
.wy-eye::before,.wy-eye::after{content:"";width:28px;height:1.5px;background:currentColor}
.wy-h2{font-weight:600;font-size:calc(clamp(32px,min(3.6vw,6vh),58px) * 0.86);line-height:1.08;letter-spacing:-.04em;color:#141414}
.wy-h2 span{font-family:"Outfit",var(--pj),sans-serif;font-weight:700;color:var(--o);letter-spacing:-.045em}
.wy-body{width:100%;max-width:1320px;margin-top:clamp(22px,4.6vh,54px);display:flex;flex-direction:column;gap:clamp(18px,3.6vh,40px)}
.wy-pills{display:grid;grid-template-columns:repeat(3,1fr)}
.wy-p{position:relative;padding:clamp(6px,1.4vh,14px) clamp(22px,3vw,48px);text-align:center;display:flex;flex-direction:column;align-items:center}
.wy-p+.wy-p::before{content:"";position:absolute;left:0;top:10%;bottom:10%;width:1px;background:linear-gradient(180deg,transparent,#DCD4C9,transparent)}
.wy-ic{display:grid;place-items:center;width:clamp(54px,8vh,68px);height:clamp(54px,8vh,68px);border-radius:20px;background:linear-gradient(160deg,#FFFFFF,#FBEFE7);border:1px solid #F1E2D7;transition:transform .6s cubic-bezier(.34,1.56,.64,1),background .45s,border-color .45s}
.wy-ic svg{width:46%;height:46%;fill:none;stroke:var(--o);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
.wy-p h3{margin-top:clamp(12px,2.2vh,22px);font-family:"Outfit",var(--pj),sans-serif;font-weight:600;font-size:calc(clamp(21px,min(1.8vw,3.4vh),28px) * 0.86);letter-spacing:-.03em;color:#141414;transition:color .35s}
.wy-p p{margin-top:8px;max-width:300px;font-size:calc(clamp(14px,min(1.05vw,1.9vh),15.5px) * 0.86);line-height:1.6;color:#5c5852}
.wy-p:hover .wy-ic{transform:translateY(-6px) rotate(-6deg);background:var(--o);border-color:var(--o)}
.wy-p:hover .wy-ic svg{stroke:#fff}
.wy-p:hover h3{color:var(--o)}
/* feature: Connected Expertise */
.wy-feat{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(260px,.9fr) 2fr;align-items:center;gap:clamp(24px,3.4vw,60px);padding:clamp(22px,4vh,44px) clamp(24px,3.4vw,56px);border-radius:28px;color:#fff;background:linear-gradient(120deg,#F38A57 0%,#DC6A40 48%,#B9482A 100%)}
.wy-feat::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(50% 120% at 90% 0%,rgba(255,255,255,.25),transparent 60%),radial-gradient(40% 90% at 0% 100%,rgba(120,30,10,.25),transparent 70%)}
.wy-ic.lt{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);width:52px;height:52px;border-radius:16px}
.wy-ic.lt svg{stroke:#fff}
.wy-fl h3{margin-top:14px;font-family:"Outfit",var(--pj),sans-serif;font-weight:600;font-size:calc(clamp(26px,min(2.4vw,4.4vh),38px) * 0.86);letter-spacing:-.035em}
.wy-fl p{margin-top:8px;font-size:calc(clamp(14px,min(1.05vw,1.95vh),16px) * 0.86);line-height:1.6;color:rgba(255,255,255,.88)}
.wy-fr{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.4vw,22px)}
.wy-line{position:absolute;left:8%;right:8%;top:50%;height:1px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 6px,transparent 6px 12px);z-index:-1}
.wy-f{position:relative;display:flex;flex-direction:column;gap:12px;padding:clamp(14px,2.4vh,22px) clamp(14px,1.4vw,22px);border-radius:20px;background:rgba(255,255,255,.96);color:#141414;transition:transform .55s var(--ez),background .4s}
.wy-f .lg{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:#fff;border:1px solid #EFE6DD;transition:transform .55s var(--ez)}
.wy-f .lg img{max-width:38px;max-height:32px;object-fit:contain}
.wy-f small{display:block;font-size:calc(11px * 0.86);font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--o)}
.wy-f b{display:block;margin-top:4px;font-family:"Outfit",var(--pj),sans-serif;font-weight:600;font-size:calc(clamp(17px,min(1.35vw,2.6vh),21px) * 0.86);letter-spacing:-.02em;line-height:1.2}
.wy-f em{display:block;margin-top:4px;font-style:normal;font-size:calc(13px * 0.86);line-height:1.45;color:#6a645d}
.wy-f .go{position:absolute;right:16px;top:16px;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid rgba(220,106,64,.4);transition:background .35s,transform .5s var(--ez),border-color .35s}
.wy-f .go svg{width:15px;height:15px;fill:none;stroke:var(--o);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.wy-f:hover{transform:translateY(-6px);background:#fff}
.wy-f:hover .lg{transform:rotate(-8deg) scale(1.06)}
.wy-f:hover .go{background:var(--o);border-color:var(--o);transform:rotate(-45deg)}
.wy-f:hover .go svg{stroke:#fff}
.wy-f:hover b{color:var(--o)}
@media(max-width:899px){.wy-pills{grid-template-columns:1fr;gap:28px}.wy-p+.wy-p::before{display:none}.wy-feat{grid-template-columns:1fr}.wy-fr{grid-template-columns:1fr}.wy-line{display:none}}

.sp-grid{width:100%;max-width:1320px;display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(30px,4.4vw,80px);align-items:center}
.sp-pills{margin-top:clamp(20px,4vh,44px);display:flex;flex-direction:column}
.sp-p{display:flex;gap:20px;align-items:flex-start;padding:clamp(12px,2.2vh,22px) 0;border-top:1px solid #E3DCD2}
.sp-p:last-child{border-bottom:1px solid #E3DCD2}
.sp-p .wy-ic{flex:none;width:52px;height:52px;border-radius:16px}
.sp-p h3{font-family:"Outfit",var(--pj),sans-serif;font-weight:600;font-size:calc(clamp(20px,min(1.6vw,3vh),25px) * 0.86);letter-spacing:-.03em;transition:color .35s}
.sp-p p{margin-top:4px;font-size:calc(15px * 0.86);line-height:1.55;color:#5c5852}
.sp-p:hover .wy-ic{transform:rotate(-6deg);background:var(--o);border-color:var(--o)}
.sp-p:hover .wy-ic svg{stroke:#fff}.sp-p:hover h3{color:var(--o)}
.sp-r{position:relative;overflow:hidden;isolation:isolate;border-radius:30px;padding:clamp(26px,4.4vh,48px) clamp(24px,2.6vw,44px);color:#fff;background:linear-gradient(150deg,#F38A57 0%,#DC6A40 50%,#B9482A 100%)}
.sp-r::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 60% at 100% 0%,rgba(255,255,255,.25),transparent 60%)}
.sp-r h3{margin-top:16px;font-family:"Outfit",var(--pj),sans-serif;font-weight:600;font-size:calc(clamp(28px,min(2.6vw,4.6vh),40px) * 0.86);letter-spacing:-.035em}
.sp-r>p{margin-top:8px;font-size:calc(15.5px * 0.86);line-height:1.6;color:rgba(255,255,255,.88)}
.sp-firms{margin-top:clamp(18px,3.4vh,32px);display:flex;flex-direction:column;gap:10px}
.sp-f{display:flex;align-items:center;gap:16px;padding:12px 16px 12px 12px;border-radius:18px;background:rgba(255,255,255,.96);color:#141414;transition:transform .5s var(--ez)}
.sp-f .lg{display:grid;place-items:center;width:48px;height:48px;border-radius:13px;border:1px solid #EFE6DD;background:#fff;flex:none}
.sp-f .lg img{max-width:34px;max-height:28px}
.sp-f small{display:block;font-size:calc(10.5px * 0.86);font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--o)}
.sp-f b{display:block;font-family:"Outfit",var(--pj),sans-serif;font-weight:600;font-size:calc(18px * 0.86);letter-spacing:-.02em}
.sp-f .go{margin-left:auto;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid rgba(220,106,64,.4);transition:background .35s,transform .5s var(--ez)}
.sp-f .go svg{width:15px;height:15px;fill:none;stroke:var(--o);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sp-f:hover{transform:translateX(8px)}.sp-f:hover .go{background:var(--o);transform:rotate(-45deg)}.sp-f:hover .go svg{stroke:#fff}.sp-f:hover b{color:var(--o)}
@media(max-width:899px){.sp-grid{grid-template-columns:1fr}}

.wy-btn{margin-top:10px;display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;border:1.5px solid var(--o);color:var(--o);font-weight:500;font-size:calc(13.5px * 0.86);position:relative;overflow:hidden;isolation:isolate;transition:color .35s}
.wy-btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--o);transform:scaleX(0);transform-origin:0 50%;transition:transform .45s var(--ez)}
.wy-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s var(--ez)}
.wy-btn:hover{color:#fff}.wy-btn:hover::before{transform:none}.wy-btn:hover svg{transform:translateX(4px)}
/* one-by-one reveal when the section arrives */
.sp .ri{opacity:0;transform:translateY(34px);filter:blur(6px);transition:opacity .8s var(--ez) calc(.15s + var(--k) * .13s),transform .9s var(--ez) calc(.15s + var(--k) * .13s),filter .8s var(--ez) calc(.15s + var(--k) * .13s)}
.sp .ri[data-from="r"]{transform:translateX(70px)}
.sp.on .ri{opacity:1;transform:none;filter:none}
.sp .sp-f.ri{transition-property:opacity,transform,filter}
.sp.on .sp-f.ri:hover{transform:translateX(8px);transition-delay:0s}
@media(max-height:780px) and (min-width:900px){.sp-p{padding:10px 0}.sp-p p{font-size:calc(14px * 0.86)}.sp-r{padding:22px 28px}.sp-firms{margin-top:14px}.sp-f{padding:8px 14px 8px 8px}}

/* ===== Section 4: timeline + line art ===== */
.sv.lx{background:radial-gradient(70% 60% at 50% 40%,#FFFFFF,#F7F4EF 60%,#EFEAE3);justify-content:center}
@media(min-width:900px) and (min-height:600px){.sv.lx{height:100vh;height:100svh}}
.lx .sv-silk path{stroke:#B9A898;stroke-opacity:.12}
.lx-in{width:100%;max-width:1320px}
.lx-eye{display:inline-flex;align-items:center;gap:10px;font-size:calc(12px * 0.86);font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--o)}
.lx-eye i{width:7px;height:7px;border-radius:50%;background:var(--o);box-shadow:0 0 0 4px rgba(220,106,64,.18)}
.lx-h2{margin-top:clamp(10px,1.8vh,16px);font-family:"Outfit",var(--pj),sans-serif;font-weight:500;font-size:calc(clamp(38px,min(3.9vw,7vh),64px) * 0.86);line-height:1.04;letter-spacing:-.045em;color:#141414}
.lx-h2 span{color:var(--o)}
.lx-lead{margin-top:clamp(10px,1.8vh,16px);max-width:520px;font-size:calc(clamp(15px,1.1vw,17px) * 0.86);line-height:1.6;color:#5c5852}
.lx-link{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:calc(14.5px * 0.86);color:var(--o)}
.lx-link svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s var(--ez)}
.lx-link:hover svg{transform:translateX(6px)}
.lx .ri{opacity:0;transform:translateY(30px);transition:opacity .8s var(--ez) calc(.15s + var(--k,0) * .12s),transform .9s var(--ez) calc(.15s + var(--k,0) * .12s)}
.lx.on .ri{opacity:1;transform:none}
/* vertical timeline */
.tl{position:relative;margin-top:clamp(18px,3.4vh,34px);padding-left:30px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:1.5px;background:#E2D8CC}
.tl-fill{position:absolute;left:6px;top:8px;width:1.5px;height:var(--p,0%);background:var(--o);transition:height .7s var(--ez)}
.tl-it{position:relative;padding:clamp(4px,.8vh,8px) 0}
.tl-node{position:absolute;left:-30px;top:clamp(9px,1.35vh,13px);width:13px;height:13px;border-radius:4px;background:#E2D8CC;transition:background .4s,box-shadow .4s,transform .5s cubic-bezier(.34,1.56,.64,1)}
.tl-t{display:block;font-family:"Outfit",var(--pj),sans-serif;font-weight:500;font-size:calc(clamp(17px,min(1.35vw,2.6vh),21px) * 0.86);letter-spacing:-.02em;color:#B3A89D;transition:color .4s}
.tl-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--ez)}
.tl-body>*{overflow:hidden}
.tl-body p{font-size:calc(clamp(13.5px,1vw,15px) * 0.86);line-height:1.55;color:#4f4a44;margin-top:6px;opacity:0;transition:opacity .4s}
.tl-body .lx-link{margin:8px 0 4px;opacity:0;transition:opacity .4s}
.tl-body{grid-template-rows:0fr 0fr}
.tl-it.act .tl-body{grid-template-rows:1fr 1fr}
.tl-it.act .tl-body p,.tl-it.act .tl-body .lx-link{opacity:1;transition-delay:.2s}
.tl-it.act .tl-node{background:var(--o);box-shadow:0 0 0 5px rgba(220,106,64,.18);transform:scale(1.1)}
.tl-it.act .tl-t,.tl-it:hover .tl-t{color:#141414}
.tl-it.done .tl-node{background:#F1B596}
@media(max-height:780px) and (min-width:900px){.lx-lead{display:none}}
@media(max-width:899px){.lx-grid{grid-template-columns:1fr!important}.lx-art{display:none}}

.lx-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(20px,3vw,60px);align-items:center}
.rg{position:relative;height:clamp(400px,64vh,600px);perspective:1400px}
.rg-tilt{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;transform:rotateX(64deg) rotateZ(-22deg)}
.rg-r{position:absolute;left:0;top:0;width:calc(clamp(210px,17vw,260px) + var(--n) * clamp(62px,5.4vw,90px));aspect-ratio:1;border-radius:50%;border:1.2px solid #D8CABD;transform:translate(-50%,-50%) rotate(0deg);animation:rg-spin calc(40s + var(--n) * 9s) linear infinite;transition:border-color .5s,border-width .5s}
.rg-r:nth-child(even){animation-direction:reverse}
@keyframes rg-spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.rg-r i{position:absolute;left:50%;top:-5px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#CFC0B2;transition:background .5s,box-shadow .5s,transform .5s}
.rg-r::after{content:"";position:absolute;right:12%;bottom:6%;width:6px;height:6px;border-radius:50%;background:#E0D4C8}
.rg-r.act{border-color:var(--o);border-width:2px;animation-duration:12s}
.rg-r.act i{background:var(--o);box-shadow:0 0 0 6px rgba(220,106,64,.18),0 0 14px rgba(220,106,64,.8);transform:scale(1.4)}
.lx.on .rg-r{animation-name:rg-spin}
.rg-core{position:absolute;left:50%;top:50%;width:clamp(150px,12.5vw,186px);aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center;text-align:center;transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
.rg-disc{position:absolute;inset:0;border-radius:50%;background:rgba(232,226,219,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #DDD2C6;transition:background .6s,border-color .6s}

/* ================= ABOUT: TEAM ================= */
.tm{position:relative;background:#FBF8F4;font-family:"Poppins",sans-serif;color:#141414;overflow:hidden}
.tm::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(40% 30% at 90% 6%,rgba(220,106,64,.10),transparent 70%),radial-gradient(35% 25% at 4% 40%,rgba(220,106,64,.07),transparent 70%)}
.tm-in{position:relative;max-width:1520px;margin:0 auto;padding:calc(96px + 4vh) 28px 110px}
.tm-intro{max-width:900px}
.tm-eye{display:inline-flex;align-items:center;gap:10px;font-size:calc(13px * 0.86);font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--o)}
.tm-eye::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--o);box-shadow:0 0 0 5px rgba(220,106,64,.16);animation:tm-pulse 2.4s ease-out infinite}

.tm-h2{margin-top:16px;font-family:"Outfit",sans-serif;font-weight:600;font-size:calc(clamp(34px,3.6vw,58px) * 0.86);line-height:1.04;letter-spacing:-.04em}

.tm-gl::after{content:"";position:absolute;inset:0;background:var(--o);transform:scaleX(0);transform-origin:0 50%;transition:transform 1.4s var(--ez)}

.tm-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px}
.tc{position:relative;display:flex;flex-direction:column;background:#fff;border-radius:20px;box-shadow:0 0 0 1px #ece4da;opacity:0;transform:translateY(40px) scale(.97);transition:opacity .8s var(--ez),transform .9s var(--ez),box-shadow .4s;transition-delay:calc(var(--c,0) * 90ms);transform-style:preserve-3d;will-change:transform}
.tc.in{opacity:1;transform:perspective(900px) rotateX(var(--ry,0deg)) rotateY(var(--rx,0deg))}
.tc.in.hov{transition:opacity .8s,transform .25s ease-out,box-shadow .4s;transition-delay:0s}
.tc:hover{box-shadow:0 0 0 1.5px var(--o),0 30px 50px -26px rgba(220,106,64,.55)}
.tc::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),rgba(220,106,64,.14),transparent 60%);opacity:0;transition:opacity .4s}
.tc:hover::after{opacity:1}
.tc-ph{position:relative;aspect-ratio:4/5;border-radius:20px 20px 0 0;overflow:hidden;background:#F3EDE6}
.tc-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%;filter:saturate(.85);transition:transform 1s var(--ez),filter .6s}

.tc:hover .tc-ov,.tc:focus-within .tc-ov{opacity:1}
.tc:hover .tc-ov p,.tc:hover .tc-sk,.tc:focus-within .tc-ov p,.tc:focus-within .tc-sk{transform:none}
.tc-b{flex:1;display:flex;flex-direction:column;gap:5px;padding:16px 16px 16px}
.tc-b h3{position:relative;align-self:flex-start;font-family:"Outfit",sans-serif;font-weight:600;font-size:calc(19px * 0.86);letter-spacing:-.02em;transition:color .3s}
.tc-b h3::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:2px;background:var(--o);transform:scaleX(0);transform-origin:0 50%;transition:transform .5s var(--ez)}

.tc:hover .tc-b h3::after{transform:scaleX(1)}
.tc-b>p{font-size:calc(13px * 0.86);line-height:1.45;color:#6b655e;min-height:38px}
.tc-btns{margin-top:auto;padding-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tc-btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;border-radius:999px;font-size:calc(12.5px * 0.86);font-weight:600;transition:color .35s,box-shadow .35s,transform .35s var(--ez)}
.tc-btn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;transform:translateY(101%);transition:transform .45s var(--ez)}

.tc-btn:hover{transform:translateY(-2px)}
.tc-btn:hover::before{transform:none}
.tc-btn.ml:hover{color:#fff;box-shadow:inset 0 0 0 1.5px var(--o)}
.tc-btn:hover svg{transform:scale(1.15) rotate(-8deg)}
@media(max-width:1280px){.tm-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

<script>
(function () {
  var reduced = window.false;
  // magnetic buttons
  document.querySelectorAll(".magnetic").forEach(function (b) {
    if (reduced) return;
    b.addEventListener("pointermove", function (e) {
      var r = b.getBoundingClientRect();
      b.style.transform = "translate(" + (e.clientX - r.left - r.width / 2) * 0.22 + "px," + (e.clientY - r.top - r.height / 2) * 0.32 + "px)";
    });
    b.addEventListener("pointerleave", function () { b.style.transform = ""; });
  });
  // header hides on scroll down
  var hdr = document.getElementById("hdr"), last = 0;
  window.addEventListener("scroll", function () {
    var y = window.scrollY;
    if (y < 80 || y < last - 4) hdr.classList.remove("hide");
    else if (y > last + 4) hdr.classList.add("hide");
    last = y;
  }, { passive: true });
  // mobile menu
  var burger = document.getElementById("burger"), mnav = document.getElementById("mnav");
  burger.addEventListener("click", function () {
    var open = mnav.classList.toggle("open");
    burger.setAttribute("aria-expanded", open);
    burger.textContent = open ? "✕" : "☰";
  });
  // split [data-split] text into letters (each letter gets --i)
  document.querySelectorAll("[data-split]").forEach(function (el) {
    var start = +el.getAttribute("data-start") || 0, txt = el.getAttribute("data-split"), frag = document.createDocumentFragment();
    Array.from(txt).forEach(function (ch, i) {
      var o = document.createElement("span"), inner = document.createElement("span");
      o.className = "ch" + (ch === " " ? " sp" : ""); o.style.setProperty("--i", start + i);
      inner.className = "chi"; inner.textContent = ch === " " ? " " : ch;
      o.appendChild(inner); frag.appendChild(o);
    });
    el.insertBefore(frag, el.firstChild);
  });
})();

(function(){var h=document.getElementById('hdr');if(!h)return;function f(){h.classList.toggle('solid',window.scrollY>8);h.classList.remove('hide');}f();window.addEventListener('scroll',f,{passive:true});})();
(function(){
  // one wheel / key press = one step. Inside "Three firms" each step moves to the next firm first.
  var mq=matchMedia('(min-width:900px) and (min-height:600px)'),lock=false,secs=function(){return [].slice.call(document.querySelectorAll('main>section'));};
  function idx(){var y=scrollY+innerHeight/2,a=secs(),k=0;a.forEach(function(s,i){if(s.offsetTop<=y)k=i;});return k;}
  function tall(s){return s.offsetHeight>innerHeight+2;}
  function hold(ms){lock=true;setTimeout(function(){lock=false;},ms);}
  function go(d){var a=secs(),i=Math.max(0,Math.min(a.length-1,idx()+d)),s=a[i],top=s.offsetTop;
    if(d<0&&tall(s))top=s.offsetTop+s.offsetHeight-innerHeight;
    if(Math.abs(top-scrollY)<2)return;window.scrollTo({top:top,behavior:'smooth'});hold(900);}
  function inside(dir){var s=secs()[idx()];if(!tall(s))return false;var top=s.offsetTop,bot=top+s.offsetHeight-innerHeight;
    if(dir>0)return scrollY<bot-2&&scrollY>=top-2;return scrollY>top+2&&scrollY<=bot+2;}

<script>
/* Same proportions on every screen, at any browser zoom.
   Desktops and laptops: the page is laid out as a 1548 px wide screen and scaled to the window width,
   so the left and right margins, text sizes and spacing keep the same proportions everywhere
   (13" laptops to 4K/5K screens and TVs). Very wide, short windows (ultrawide) are limited by height
   so content never gets squeezed. Phones and tablets under 900 px use the mobile layout. */
(function(){
  var DESIGN_W = 1548, MIN_H = 688, MOBILE = 900;
  var f = document.getElementById('page');
  var html = document.getElementById('page-src').textContent.replace(/<\\\/script/g, '</script');
  f.srcdoc = html;
  function fit(){
    var w = innerWidth, h = innerHeight, s = 1;
    if (w >= MOBILE) s = Math.min(w / DESIGN_W, h / MIN_H);
    f.style.width = (w / s) + 'px';
    f.style.height = (h / s) + 'px';
    f.style.transform = s === 1 ? 'none' : 'scale(' + s + ')';
  }
  fit();
  addEventListener('resize', fit);
})();
</script>
